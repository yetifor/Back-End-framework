name: Tests CI

on:
  push:
    branches: [ "main", "feature/tests" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python and Ruff
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: |
         pip install ruff
         ruff check

  tests:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create .env
        run: |
          cat << 'EOF' > .env
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB_AUTH=${{ secrets.POSTGRES_DB_AUTH }}
          POSTGRES_DB_UNIVERSITY=${{ secrets.POSTGRES_DB_UNIVERSITY }}
          AUTH_SERVICE_INTERNAL_URL=${{ vars.AUTH_SERVICE_INTERNAL_URL }}
          AUTH_SERVICE_API_URL=${{ vars.AUTH_SERVICE_API_URL }}
          UNIVERSITY_SERVICE_INTERNAL_URL=${{ vars.UNIVERSITY_SERVICE_INTERNAL_URL }}
          UNIVERSITY_SERVICE_API_URL=${{ vars.UNIVERSITY_SERVICE_API_URL }}
          EOF

      - name: Start services
        run: |
          docker compose -p app up -d --wait
          sleep 30
        

      - name: Build image
        run: docker build -t api-tests .

      - name: Start tests
        run: |
          docker run --rm \
          --network host \
          --env-file .env \
          -v ${{ github.workspace }}/allure_results:/app/allure_results \
          api-tests

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure_results


  publish-report:
    needs: [tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.9
        if: always()
        with:
          allure_results: allure_results
          allure_history: allure_history
          gh_pages: gh_pages
          allure_report: allure-report

      - name: Deploy results to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-results